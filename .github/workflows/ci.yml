name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Valores fictícios: o build só precisa que as variáveis existam e tenham o formato certo.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      APP_URL: https://hookbox.example.com
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      QSTASH_TOKEN: ci-qstash-token
      QSTASH_CURRENT_SIGNING_KEY: ci-current-signing-key
      QSTASH_NEXT_SIGNING_KEY: ci-next-signing-key
      UPSTASH_REDIS_REST_URL: https://example.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-redis-token
      CRON_SECRET: ci-cron-secret-0123456789
      DEMO_EMAIL: demo@hookbox.dev
      DEMO_PASSWORD: ci-demo-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Valida RLS, triggers e as travas da conta demo rodando os testes pgTAP em um Postgres local
  # (só banco e auth; o restante da stack do Supabase fica de fora).
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - run: supabase start -x studio,imgproxy,mailpit,storage-api,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta,postgrest,kong
      - run: supabase test db
